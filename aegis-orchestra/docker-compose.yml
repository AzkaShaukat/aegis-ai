# ============================================================
# Aegis AI — Orchestra Only
# Other services (8000-8004) are running separately on host
# ============================================================
version: "3.9"

services:
  orchestra:
    build: .
    container_name: aegis-orchestra
    ports:
      - "8006:8006"
    env_file:
      - .env.host
    environment:
      # Point to HOST services (not Docker containers)
      LINK_SERVICE_URL: http://host.docker.internal:8000
      LINK_ANALYZER_URL: http://host.docker.internal:8000
      QR_SERVICE_URL: http://host.docker.internal:8001
      QR_SCANNER_URL: http://host.docker.internal:8001
      CREDENTIAL_SERVICE_URL: http://host.docker.internal:8002
      CREDENTIAL_ANALYZER_URL: http://host.docker.internal:8002
      PROFILE_SERVICE_URL: http://host.docker.internal:8003
      PROFILE_ANALYZER_URL: http://host.docker.internal:8003
      DEEPFAKE_SERVICE_URL: http://host.docker.internal:8004
      REDIS_URL: redis://host.docker.internal:6379/2
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# NOTE: Do NOT add Redis/other services here.
# They run on the host. Orchestra connects to them via host.docker.internal.
