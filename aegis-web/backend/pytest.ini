[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    asyncio: async test
    unit: unit test (no DB)
    integration: integration test (requires DB)
log_cli = true
log_cli_level = WARNING
