[pytest]
testpaths      = tests
python_files   = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode   = auto
addopts        =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    slow: Tests that take > 30 seconds
    ws: WebSocket tests requiring websockets package
    ml: ML classifier tests
